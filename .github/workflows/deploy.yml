name: Deploy

# Deploys only when you press the button: Actions → Deploy → Run workflow.
# Nothing reaches the server on a push, so an unfinished branch cannot go
# live by accident. The tests still gate it — a red run refuses to deploy.
#
# What gets deployed is the branch picked in the "Use workflow from" dropdown,
# and nothing else. There used to be a `branch` input as well, defaulting to a
# fixed branch name, and the two disagreed in the worst possible way: the run
# was labelled with the dropdown's branch while both jobs checked out the
# input's default. A deploy of the wrong code reported success, and the tests
# that "passed" had never seen the commit being shipped.
#
# One control cannot disagree with itself.
on:
  workflow_dispatch:

concurrency:
  # Two deploys overlapping would race on the git reset and the migration.
  group: deploy-production
  cancel-in-progress: false

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: testing
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pgsql, redis, mbstring, xml, curl, zip, bcmath, intl, gd
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # Feature tests render real pages, and @vite() throws without a
      # manifest. public/build is gitignored, so the runner has to build it
      # before the suite runs — locally it is already there from dev work,
      # which is why this only ever failed in CI.
      - name: Build assets for the render tests
        run: |
          npm ci
          npm run build

      - name: Run tests
        run: |
          cp .env.example .env

          # .env.example ships DB_CONNECTION=sqlite, and phpunit.xml sets
          # DB_DATABASE but not DB_CONNECTION — so without this the suite
          # runs against a sqlite file that does not exist here. Writing the
          # values into .env rather than exporting them matters: phpunit.xml's
          # own <env> entries win over shell variables.
          sed -i 's|^DB_CONNECTION=.*|DB_CONNECTION=pgsql|' .env
          sed -i 's|^# *DB_HOST=.*|DB_HOST=127.0.0.1|'     .env
          sed -i 's|^# *DB_PORT=.*|DB_PORT=5432|'          .env
          sed -i 's|^# *DB_DATABASE=.*|DB_DATABASE=testing|' .env
          sed -i 's|^# *DB_USERNAME=.*|DB_USERNAME=postgres|' .env
          sed -i 's|^# *DB_PASSWORD=.*|DB_PASSWORD=postgres|' .env

          grep -q '^DB_HOST='     .env || echo 'DB_HOST=127.0.0.1'   >> .env
          grep -q '^DB_PORT='     .env || echo 'DB_PORT=5432'        >> .env
          grep -q '^DB_DATABASE=' .env || echo 'DB_DATABASE=testing' >> .env
          grep -q '^DB_USERNAME=' .env || echo 'DB_USERNAME=postgres' >> .env
          grep -q '^DB_PASSWORD=' .env || echo 'DB_PASSWORD=postgres' >> .env

          php artisan key:generate
          php artisan config:clear
          php artisan test

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, curl, zip, bcmath, intl
          coverage: none

      # Ziggy ships its JavaScript inside the Composer package, and both
      # tsconfig.json and vite.config.js resolve `ziggy-js` to
      # vendor/tightenco/ziggy. Without the vendor directory the SSR entry
      # fails to typecheck, which fails the build before Vite ever runs.
      - name: Install PHP dependencies
        run: composer install --no-dev --no-interaction --prefer-dist --no-progress

      # Built here rather than on the VPS: vite needs more memory than a 4GB
      # box shared with another site can spare.
      #
      # VITE_APP_NAME is baked into the bundle at build time, and the runner
      # has no .env for it to come from — so without it every page title was
      # built as "… - Laravel", which is what the site served after the first
      # successful deploy. It is the product name, not a secret.
      - name: Build the front-end
        env:
          VITE_APP_NAME: Resellers Hub
        run: |
          npm ci
          npm run build

      - name: Open an SSH connection
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Pinning the host key stops the deploy from trusting whatever
          # answers on that address.
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Send the built assets
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          # Both halves of the build: public/build is what the browser loads,
          # bootstrap/ssr is the bundle Node renders the pages from. Both are
          # gitignored, so the checkout on the VPS has neither.
          #
          # Checked before tarring so a missing half says which half and why,
          # rather than failing as "tar: ssr: Cannot stat" — which is what it
          # did when a checkout of the wrong branch built a bundle nobody
          # asked for.
          for dir in public/build bootstrap/ssr; do
            if [ ! -d "$dir" ]; then
              echo "::error::$dir was not built. 'npm run build' should produce both;"
              echo "::error::check the build step above for which half it stopped after."
              exit 1
            fi
          done

          tar -czf build.tar.gz -C public build
          tar -czf ssr.tar.gz -C bootstrap ssr
          scp -i ~/.ssh/deploy_key build.tar.gz "root@$SSH_HOST:/tmp/build.tar.gz"
          scp -i ~/.ssh/deploy_key ssr.tar.gz "root@$SSH_HOST:/tmp/ssr.tar.gz"

      - name: Release
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          # The branch this run was started from — the same one the
          # runner checked out and built, so the VPS cannot end up on a
          # different commit from the assets sent to it.
          BRANCH: ${{ github.ref_name }}
        run: |
          ssh -i ~/.ssh/deploy_key "root@$SSH_HOST" \
            "BRANCH='$BRANCH' bash /root/deploy.sh"

      - name: Clean up the key
        if: always()
        run: rm -f ~/.ssh/deploy_key
